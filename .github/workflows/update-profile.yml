name: Refresh profile contributions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/update_contributions.py'

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch calendar and render SVG
        run: python scripts/update_contributions.py
      - name: Commit updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg data/contributions.json
          if git diff --cached --quiet; then
            echo 'Contribution artwork is already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh contribution artwork'
          git push
